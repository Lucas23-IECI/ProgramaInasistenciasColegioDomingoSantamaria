services:

  # ── 1. Base de datos ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: colegio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 2. Backend Express ───────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: colegio_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Al estar el archivo .env al lado de este docker-compose.yml, esto lee las variables directamente
    env_file:
      - .env
    environment:
      DB_USER:     ${DB_USER}
      DB_HOST:     postgres
      DB_NAME:     ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT:     5432
      JWT_SECRET:  ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT:        5000

  # ── 3. Frontend React + nginx (build estático + proxy /api → backend) ─────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: colegio_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # ── 4. Respaldo Automático (INC-08) ──────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: colegio_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./backend/backup.sh:/backup.sh
    entrypoint: >
      sh -c "
      chmod +x /backup.sh;
      echo 'Servicio de backup automático diario iniciado.';
      while true; do
        sleep 86400;
        /backup.sh;
      done
      "

volumes:
  postgres_data:
